# Home Assistant Configuration
# All secrets stay in this file — never commit real values.
# Replace every placeholder (CHANGE_ME / x.x.x.x) before first run.

hailo:
  # Paths to Hailo-compiled model files (.hef) on the Pi filesystem.
  # Download from Hailo Model Zoo after installing HailoRT.
  llm_model_path: pi/llm/models/qwen2.5-instruct-1.5b.hef
  stt_model_path: pi/stt/models/whisper-base.hef

memory:
  # Seconds of silence before a session is considered ended.
  session_timeout_seconds: 30
  # Number of recent conversation turns to inject into the LLM prompt.
  context_turns: 6

tool_requests:
  # SQLite DB for the local tool request queue (survives reboots).
  db_path: tool_requests.db
  # How often (seconds) to attempt pushing pending requests to GitHub.
  sync_interval_seconds: 300

wake_word:
  # openWakeWord model name; custom models saved to pi/wake_word/models/
  model: hey_jarvis
  threshold: 0.5         # 0.0–1.0; higher = fewer false positives
  # Require this many consecutive 80ms frames above threshold before triggering.
  min_activation_count: 3
  # Seconds to suppress the wake-word callback after it fires once.
  cooldown_seconds: 2.0

google:
  credentials_file: config/google_credentials.json
  token_file: config/google_token.json
  # OAuth2 scopes (requested together during first-run auth flow)
  scopes:
    - https://www.googleapis.com/auth/calendar
    - https://www.googleapis.com/auth/tasks

spotify:
  # Both users must have Spotify Premium for Connect API to work
  owner:
    client_id: CHANGE_ME
    client_secret: CHANGE_ME
    redirect_uri: http://localhost:8888/callback
  emily:
    client_id: CHANGE_ME
    client_secret: CHANGE_ME
    redirect_uri: http://localhost:8889/callback

cta:
  # Register free API key at: https://www.transitchicago.com/developers/traintrackerapply/
  api_key: cf2d115499934a2dbe21fa2e6b424315
  # Blue Line stop IDs for Western & Milwaukee (O'Hare-bound and Forest Park-bound platforms)
  stop_id_ohare: 30238
  stop_id_forest_park: 30239

weather:
  api_key: 3816095f8fae97af0c85efa4dfacd7e8
  location: "Chicago, IL"
  units: imperial   # imperial = °F, metric = °C

androidtv:
  host: 192.168.0.250
  port: 6466           # Android TV Remote Service protocol (no ADB needed)
  # TLS cert pair generated automatically on first run (stored locally, never committed)
  cert_file: config/androidtv_cert.pem
  key_file: config/androidtv_key.pem
  apps:
    spotify: com.spotify.tv.android
    netflix: com.netflix.ninja
    youtube: com.google.android.youtube.tv

users:
  owner:
    name: Jeff
    spotify_token_file: config/spotify_token_owner.json
  emily:
    name: Emily
    spotify_token_file: config/spotify_token_emily.json

tts:
  # Download voice models from: https://github.com/rhasspy/piper/blob/master/VOICES.md
  # Place .onnx + .onnx.json files in pi/tts/models/
  model_path: pi/tts/models/en_US-lessac-medium.onnx
  use_cuda: false

audio:
  # sounddevice output device index (run: python -c "import sounddevice as sd; print(sd.query_devices())")
  output_device: null     # null = ALSA default (handles mono→stereo for homeassistant user)
  output_sample_rate: 48000

voice_profiles:
  directory: config/voice_profiles/

logging:
  log_dir: logs
  log_file: homeassistant.log
  max_bytes: 10485760   # 10 MB per file
  backup_count: 5       # keep up to 5 rotated files
  level: INFO
